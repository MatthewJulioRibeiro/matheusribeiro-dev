<!DOCTYPE html>
<html lang="pt-BR" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Matheus Ribeiro - Especialista IBM App Connect Enterprise, Integration Bus e Cloud Pak for Integration. Engenheiro de Software focado em alta performance.">
    <meta name="keywords" content="IBM ACE, App Connect Enterprise, ESQL, Java, OpenShift, Integration, Middleware, Matheus Ribeiro, Developer">
    <meta property="og:title" content="Matheus Ribeiro | Integration Engineer">
    <meta property="og:description" content="Especialista em Integração IBM e Modernização de Sistemas.">
    <meta property="og:type" content="website">
    
    <title>Matheus Ribeiro | System Spec</title>
    
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-white dark:bg-[#161616] text-ibm-text dark:text-[#f4f4f4] selection:bg-ibm-blue selection:text-white transition-colors duration-300">

    <div id="loading-screen" class="fixed inset-0 z-[100] bg-white dark:bg-[#161616] flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <div class="font-mono text-xs text-slate-500 dark:text-slate-400 animate-pulse">INITIALIZING_SYSTEM...</div>
    </div>

    <div class="fixed inset-0 z-0 pointer-events-none opacity-40 dark:opacity-20" style="background-image: radial-gradient(#e0e0e0 1px, transparent 1px); background-size: 24px 24px;"></div>

    <nav class="fixed top-0 w-full bg-white/90 dark:bg-[#161616]/90 backdrop-blur-sm border-b border-slate-200 dark:border-slate-800 z-50 transition-colors duration-300 print:hidden">
        <div class="max-w-3xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <span class="font-mono text-xs font-medium text-slate-600 dark:text-slate-400">SYSTEM_ONLINE</span>
            </div>
            
            <div class="flex items-center gap-6 text-sm font-mono">
                <button id="theme-toggle" class="hover:text-ibm-blue transition-colors" title="Toggle Theme">
                    <i class="bi bi-moon-stars dark:hidden text-slate-600"></i>
                    <i class="bi bi-sun hidden dark:inline text-yellow-400"></i>
                </button>

                <button onclick="window.print()" class="hidden md:flex items-center gap-2 text-slate-500 hover:text-ibm-blue transition-colors" title="Print/Save PDF">
                    <i class="bi bi-printer"></i>
                    <span class="text-xs" id="nav-download-text">PDF</span>
                </button>

                <div class="w-px h-4 bg-slate-200 dark:bg-slate-700"></div>

                <div class="flex gap-1">
                    <button onclick="setLanguage('en')" id="btn-en" class="hover:text-ibm-blue transition-colors">EN</button>
                    <span class="text-slate-300 dark:text-slate-600">/</span>
                    <button onclick="setLanguage('pt')" id="btn-pt" class="text-slate-400 hover:text-ibm-blue transition-colors">PT</button>
                </div>
                
                <a href="#" id="nav-palette-trigger" onclick="openPalette()" class="hidden md:block hover:text-ibm-blue transition-colors text-slate-600 dark:text-slate-400" title="Command Palette (⌘K)">
                    <i class="bi bi-terminal"></i>
                </a>
            </div>
        </div>
    </nav>

    <main class="relative z-10 max-w-3xl mx-auto px-6 pt-32 pb-24">

        <header class="mb-24 fade-in flex flex-col md:flex-row gap-10 items-start">
            
            <div class="flex-1 border-l-2 border-ibm-blue pl-6 relative">
                <h1 id="profile-name" class="text-5xl md:text-6xl font-bold tracking-tight mb-4 font-sans text-slate-900 dark:text-white transition-colors"></h1>
                
                <div class="h-8 mb-6 flex items-center">
                    <h2 id="profile-role" class="text-lg md:text-xl text-ibm-blue font-mono"></h2>
                    <span class="w-2 h-5 bg-ibm-blue ml-1 animate-blink inline-block"></span>
                </div>

                <p id="profile-summary" class="text-lg text-slate-700 dark:text-slate-300 leading-relaxed font-light transition-colors"></p>

                <div class="mt-10 flex flex-wrap items-center gap-4">
                    <a id="email-btn" href="#" class="group flex items-center gap-3 px-5 py-2.5 bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-sm font-mono hover:bg-ibm-blue dark:hover:bg-ibm-blue dark:hover:text-white transition-all shadow-lg shadow-slate-200 dark:shadow-none">
                        <i class="bi bi-envelope"></i> 
                        <span id="contact-text">Connect</span>
                        <i class="bi bi-arrow-right opacity-0 group-hover:opacity-100 transition-all -ml-2 group-hover:ml-0"></i>
                    </a>
                    <a id="linkedin-btn-header" href="#" target="_blank" rel="noopener noreferrer" class="px-5 py-2.5 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 text-sm font-mono hover:border-ibm-blue hover:text-ibm-blue dark:hover:border-ibm-blue dark:hover:text-ibm-blue transition-colors bg-white dark:bg-transparent">
                        LinkedIn
                    </a>
                </div>
            </div>

            <div class="w-32 h-32 md:w-40 md:h-40 flex-shrink-0 relative group hidden md:block">
                <div class="absolute inset-0 bg-ibm-blue rounded-full opacity-0 group-hover:opacity-20 transition-opacity blur-lg"></div>
                <img id="profile-img" src="" alt="Profile" class="w-full h-full object-cover rounded-full border-2 border-slate-200 dark:border-slate-700 grayscale group-hover:grayscale-0 transition-all duration-500 shadow-xl">
            </div>
        </header>

        <div class="hidden md:flex flex-col items-center justify-center absolute bottom-10 left-1/2 -translate-x-1/2 animate-bounce fade-in delay-3 opacity-50">
            <span class="font-mono text-[10px] uppercase text-slate-400 mb-1" id="scroll-text">Scroll</span>
            <i class="bi bi-arrow-down text-slate-400"></i>
        </div>

        <section class="mb-24 fade-in delay-1">
            <div class="flex items-center gap-4 mb-8">
                <h3 class="section-label" id="title-core">System Specs</h3>
                <div class="h-px bg-slate-200 dark:bg-slate-800 flex-1 transition-colors"></div>
            </div>
            <div id="core-stack" class="grid grid-cols-2 md:grid-cols-4 gap-4 font-mono text-sm"></div>
        </section>

        <section class="mb-24 fade-in delay-2">
            <div class="flex items-center gap-4 mb-8">
                <h3 class="section-label" id="title-projects">Projects</h3>
                <div class="h-px bg-slate-200 dark:bg-slate-800 flex-1 transition-colors"></div>
            </div>
            <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                </div>
        </section>

        <section class="mb-24 fade-in delay-2">
            <div class="flex items-center gap-4 mb-10">
                <h3 class="section-label" id="title-experience">Runtime Logs</h3>
                <div class="h-px bg-slate-200 dark:bg-slate-800 flex-1 transition-colors"></div>
            </div>
            <div id="experience-list" class="space-y-12 border-l border-slate-200 dark:border-slate-800 ml-2 pl-8 relative transition-colors"></div>
        </section>

        <section class="mb-24 fade-in delay-3">
            <div class="flex items-center gap-4 mb-8">
                <h3 class="section-label" id="title-skills">Loaded Modules</h3>
                <div class="h-px bg-slate-200 dark:bg-slate-800 flex-1 transition-colors"></div>
            </div>
            <div id="skills-grid" class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-8"></div>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-12 pt-10 border-t border-slate-200 dark:border-slate-800 fade-in delay-3 transition-colors">
            <div>
                <h4 class="font-mono text-xs text-slate-500 dark:text-slate-400 mb-4 uppercase font-bold tracking-wider" id="title-education">Kernel / Education</h4>
                <div id="education-list" class="font-mono text-sm text-slate-700 dark:text-slate-300"></div>
            </div>
            <div>
                <h4 class="font-mono text-xs text-slate-500 dark:text-slate-400 mb-4 uppercase font-bold tracking-wider" id="title-languages">Locale / Languages</h4>
                <div id="languages-list" class="space-y-2"></div>
            </div>
        </div>

        <footer class="mt-20 text-center text-slate-500 dark:text-slate-500 text-[10px] font-mono uppercase tracking-widest opacity-80 pb-8">
            Start_Time: 2025 &bull; Status: Active
        </footer>

    </main>

    <div id="command-palette" class="fixed inset-0 z-[100] hidden print:hidden">
        <div class="absolute inset-0 bg-white/80 dark:bg-black/80 backdrop-blur-sm transition-opacity" onclick="closePalette()"></div>
        <div class="relative w-full max-w-lg mx-auto mt-32 bg-white dark:bg-[#1e1e1e] border border-slate-200 dark:border-slate-700 shadow-2xl transform transition-all scale-95 opacity-0 rounded-lg overflow-hidden" id="palette-content">
            <div class="flex items-center px-4 py-3 border-b border-slate-100 dark:border-slate-700">
                <span class="font-mono text-ibm-blue mr-3">></span>
                <input type="text" id="palette-input" class="flex-1 outline-none text-slate-700 dark:text-slate-200 placeholder:text-slate-400 dark:placeholder:text-slate-500 font-mono text-sm bg-transparent" placeholder="Type command..." autocomplete="off">
            </div>
            <div id="palette-results" class="max-h-64 overflow-y-auto py-1"></div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
