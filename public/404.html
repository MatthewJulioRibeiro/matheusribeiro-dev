<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-white dark:bg-[#161616] text-slate-900 dark:text-slate-100 h-screen flex flex-col items-center justify-center selection:bg-ibm-blue selection:text-white transition-colors duration-300">

    <div class="fixed top-0 w-full border-b border-slate-100 dark:border-slate-800">
        <div class="max-w-3xl mx-auto px-6 h-14 flex items-center">
            <a href="/" class="font-bold text-sm tracking-tight hover:text-ibm-blue transition-colors text-slate-900 dark:text-white">matheusribeiro.dev.br</a>
        </div>
    </div>

    <main class="text-center px-6 max-w-lg fade-in">
        
        <p class="font-mono text-xs text-slate-400 uppercase tracking-widest mb-4">Error 404</p>
        
        <h1 class="text-6xl md:text-8xl font-bold tracking-tighter text-slate-900 dark:text-white mb-6">
            Lost?
        </h1>
        
        <div class="w-12 h-1 bg-ibm-blue mx-auto mb-8"></div>

        <p class="text-lg text-slate-600 dark:text-slate-400 leading-relaxed mb-10">
            The page you are looking for does not exist or has been moved. 
            Please check the URL or return to the main profile.
        </p>

        <a href="/" class="group inline-flex items-center gap-3 text-sm font-mono text-slate-500 hover:text-ibm-blue transition-colors border-b border-transparent hover:border-ibm-blue pb-0.5">
            <i class="bi bi-arrow-left transition-transform group-hover:-translate-x-1"></i>
            Back to Home
        </a>

    </main>

    <footer class="fixed bottom-8 text-center w-full text-slate-300 dark:text-slate-600 text-[10px] font-mono">
        System_Status: 404_Not_Found
    </footer>

</body>
</html>
